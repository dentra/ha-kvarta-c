update_value:
  name: Update counter value
  description: Send counter readings of one account in one request.
  fields:
    values:
      name: Values
      description: Readings per counter sensor.
      required: true
      selector:
        object:
          multiple: true
          label_field: entity_id
          description_field: value
          translation_key: values
          fields:
            entity_id:
              required: true
              selector:
                entity:
                  filter:
                    integration: kvartac
                    domain: sensor
                    device_class:
                      - gas
                      - volume
                      - energy
            value:
              required: true
              selector:
                number:
                  min: 1
                  max: 999999
                  mode: box
    throws:
      name: Fail on error
      description: Fail the action if readings of any counter were not sent. When the action response is stored in a variable, errors are returned in the response.
      default: true
      selector:
        boolean:
send_linked:
  name: Send readings of linked sensors
  description: Send counter readings from the linked sensors configured in the integration options.
  fields:
    throws:
      name: Fail on error
      description: Fail the action if readings of any counter were not sent. When the action response is stored in a variable, errors are returned in the response.
      default: true
      selector:
        boolean:
